[package]
name = "gameboy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "gameboy_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
integration-test-support = ["gb-network/integration-test-support"]

[lints]
workspace = true

[dependencies]
cpal = { version = "=0.18.2", default-features = false }
gb-core = { path = "../../../crates/gb-core" }
gb-network = { path = "../../../crates/gb-network" }
ringbuf = "=0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"

[dev-dependencies]
futures-util = "=0.3.34"
serde_json = "1.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.28.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
