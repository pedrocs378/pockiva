name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pockiva-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Validate and resolve release version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version="$(node scripts/release-config.mjs --previous-ref "$BASE_SHA" --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or resume the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          find_releases_by_tag() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -c --arg tag "$TAG" '[add[] | select(.tag_name == $tag)]'
          }

          require_matching_draft() {
            local release_json="$1"
            if ! jq -e \
              --arg tag "$TAG" \
              --arg merge_sha "$MERGE_SHA" \
              '.draft == true and
               .prerelease == false and
               .tag_name == $tag and
               .target_commitish == $merge_sha and
               (.id | type == "number")' \
              <<< "$release_json" >/dev/null
            then
              echo "Release $TAG is not a resumable draft for merged commit $MERGE_SHA." >&2
              exit 1
            fi
          }

          matching_releases="$(find_releases_by_tag)"
          release_count="$(jq -er 'length' <<< "$matching_releases")"
          if (( release_count > 1 )); then
            echo "Multiple releases exist for $TAG; refusing ambiguous recovery." >&2
            exit 1
          fi

          tag_error="$(mktemp)"
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>"$tag_error")"; then
            tag_sha="$(jq -er 'select(.object.type == "commit") | .object.sha' <<< "$tag_ref")"
            if (( release_count == 0 )); then
              echo "Tag $TAG exists without a resumable draft release." >&2
              exit 1
            fi
            if [[ "$tag_sha" != "$MERGE_SHA" ]]; then
              echo "Tag $TAG points to $tag_sha instead of merged commit $MERGE_SHA." >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$tag_error"; then
            tag_sha=''
          else
            cat "$tag_error" >&2
            echo "Unable to verify whether tag $TAG already exists." >&2
            exit 1
          fi
          rm "$tag_error"

          if (( release_count == 0 )); then
            release_json="$(gh api \
              --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$MERGE_SHA" \
              -f name="Pockiva $VERSION" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true)"
            matching_releases="$(jq -c '[.]' <<< "$release_json")"
          fi

          release_json="$(jq -c '.[0]' <<< "$matching_releases")"
          require_matching_draft "$release_json"
          release_id="$(jq -er '.id' <<< "$release_json")"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS Apple Silicon release
    needs: prepare
    runs-on: macos-14
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload signed macOS artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          projectPath: apps/desktop
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Prove signing secrets were not bundled
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-config.mjs --check-bundle

  build-windows:
    name: Build Windows x64 release
    needs: [prepare, build-macos]
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload signed Windows artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          projectPath: apps/desktop
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Prove signing secrets were not bundled
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/release-config.mjs --check-bundle

  publish:
    name: Publish complete release
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify updater manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          release_directory="$(mktemp -d)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if ! jq -e \
            --arg tag "$TAG" \
            --arg release_sha "$RELEASE_SHA" \
            '.draft == true and
             .prerelease == false and
             .tag_name == $tag and
             .target_commitish == $release_sha' \
            <<< "$release_json" >/dev/null
          then
            echo "Release $RELEASE_ID no longer matches the expected unpublished $TAG draft." >&2
            exit 1
          fi

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          manifest_assets="$(jq -c '[.[] | select(.name == "latest.json")]' <<< "$assets")"
          if [[ "$(jq -er 'length' <<< "$manifest_assets")" != "1" ]]; then
            echo "Release $TAG must contain exactly one latest.json asset." >&2
            exit 1
          fi
          manifest_asset_id="$(jq -er '.[0].id' <<< "$manifest_assets")"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id" \
            > "$release_directory/latest.json"
          jq -e '
            .platforms
            | has("darwin-aarch64")
              and has("windows-x86_64")
              and (."darwin-aarch64".signature | length > 0)
              and (."windows-x86_64".signature | length > 0)
          ' "$release_directory/latest.json"

          tag_error="$(mktemp)"
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>"$tag_error")"; then
            tag_sha="$(jq -er 'select(.object.type == "commit") | .object.sha' <<< "$tag_ref")"
          elif grep -q 'HTTP 404' "$tag_error"; then
            tag_ref="$(gh api \
              --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$RELEASE_SHA")"
            tag_sha="$(jq -er 'select(.object.type == "commit") | .object.sha' <<< "$tag_ref")"
          else
            cat "$tag_error" >&2
            echo "Unable to verify tag $TAG before publication." >&2
            exit 1
          fi
          rm "$tag_error"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $TAG points to $tag_sha instead of release commit $RELEASE_SHA." >&2
            exit 1
          fi

          published_release="$(gh api \
            --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true)"
          jq -e \
            --arg tag "$TAG" \
            --arg release_sha "$RELEASE_SHA" \
            '.draft == false and
             .prerelease == false and
             .tag_name == $tag and
             .target_commitish == $release_sha' \
            <<< "$published_release" >/dev/null
          published_tag_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq 'select(.object.type == "commit") | .object.sha')"
          if [[ "$published_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Published tag $TAG points to $published_tag_sha instead of $RELEASE_SHA." >&2
            exit 1
          fi
